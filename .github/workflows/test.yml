name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  SBCL_VERSION: 2.6.7
  ROSWELL_VERSION: "26.02.116"
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v5
      - uses: egao1980/cl-repository/.github/actions/setup-client@main
      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - name: Install SQLite (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y libsqlite3-dev
          elif command -v brew >/dev/null 2>&1; then
            brew list sqlite >/dev/null 2>&1 || brew install sqlite
          fi
      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install sqlite -y --no-progress
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: sql-protocol
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: sql-protocol

  postgres:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SQL_POSTGRES: "1"
      SQL_POSTGRES_HOST: localhost
      SQL_POSTGRES_PORT: "5432"
      SQL_POSTGRES_USER: postgres
      SQL_POSTGRES_PASSWORD: postgres
      SQL_POSTGRES_DB: postgres
    steps:
      - uses: actions/checkout@v5
      - uses: egao1980/cl-repository/.github/actions/setup-client@main
      - uses: egao1980/cl-repository/.github/actions/setup-roswell@main
        with:
          sbcl-version: ${{ env.SBCL_VERSION }}
          roswell-version: ${{ env.ROSWELL_VERSION }}
      - name: Install libpq/sqlite
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev libpq-dev
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: install
          system: sql-protocol
          with: sql-backend-postgres
      - uses: egao1980/cl-repository/.github/actions/ci@main
        with:
          phase: test
          system: sql-protocol
